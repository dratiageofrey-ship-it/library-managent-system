{% extends "base.html" %}

{% block title %}Edit Member - Library Management System{% endblock %}

{% block content %}
<h2>Edit Member</h2>

<div class="card" style="max-width: 600px;">
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    {% if member %}
        <form method="POST">
            <div class="form-group">
                <label for="first_name">First Name</label>
                <input type="text" id="first_name" name="first_name" value="{{ member.first_name }}" required>
            </div>

            <div class="form-group">
                <label for="last_name">Last Name</label>
                <input type="text" id="last_name" name="last_name" value="{{ member.last_name }}" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ member.email or '' }}">
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" value="{{ member.phone or '' }}">
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" name="address" rows="3">{{ member.address or '' }}</textarea>
            </div>

            <div class="form-group">
                <label for="membership_status">Membership Status</label>
                <select id="membership_status" name="membership_status" required>
                    <option value="ACTIVE" {% if member.membership_status == 'ACTIVE' %}selected{% endif %}>Active</option>
                    <option value="SUSPENDED" {% if member.membership_status == 'SUSPENDED' %}selected{% endif %}>Suspended</option>
                    <option value="EXPIRED" {% if member.membership_status == 'EXPIRED' %}selected{% endif %}>Expired</option>
                </select>
            </div>

            <div>
                <button type="submit" class="btn">✅ Update Member</button>
                <a href="{{ url_for('members') }}" class="btn" style="background-color: #95a5a6;">Cancel</a>
            </div>
        </form>
    {% else %}
        <p>Member not found.</p>
    {% endif %}
</div>
{% endblock %}
