{% extends "base.html" %}

{% block title %}Borrow Book - Library Management System{% endblock %}

{% block content %}
<h2>Borrow Book</h2>

<div class="card" style="max-width: 600px;">
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <div class="form-group">
            <label for="member_id">Member</label>
            <select id="member_id" name="member_id" required>
                <option value="">Select Member</option>
                {% for member in members %}
                    <option value="{{ member.member_id }}">{{ member.first_name }} {{ member.last_name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="book_id">Book</label>
            <select id="book_id" name="book_id" required>
                <option value="">Select Available Book</option>
                {% for book in books %}
                    <option value="{{ book.book_id }}">{{ book.title }} (Available: {{ book.available_copies }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="loan_days">Loan Period (Days)</label>
            <input type="number" id="loan_days" name="loan_days" value="14" min="1" max="90" required>
        </div>

        <div>
            <button type="submit" class="btn">✅ Create Loan</button>
            <a href="{{ url_for('loans') }}" class="btn" style="background-color: #95a5a6;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
