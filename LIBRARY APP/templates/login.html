{% extends "base.html" %}

{% block title %}Login - Library Management System{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 5rem auto;">
    <div class="card">
        <h2 style="text-align: center; border: none; margin-top: 0;">📚 Library Management</h2>
        <p style="text-align: center; color: #7f8c8d; margin-bottom: 2rem;">Sign in to continue</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn" style="width: 100%; text-align: center;">Login</button>
        </form>

        <hr style="margin: 2rem 0; border: none; border-top: 1px solid #ecf0f1;">

        <p style="text-align: center; color: #7f8c8d; font-size: 0.9rem;">
            Demo Credentials:<br>
            Username: <strong>admin1</strong><br>
            Password: <strong>admin123</strong>
        </p>
    </div>
</div>
{% endblock %}
